# Server block da API do Cauri. A instalação (deploy/vps/README.md, passo 4) troca
# api.SEU-DOMINIO pelo subdomínio real com sed e ativa o arquivo:
#
#   sed "s/api\.SEU-DOMINIO/$API_DOMAIN/g" cauri-api.conf | sudo tee /etc/nginx/sites-available/cauri-api.conf
#   sudo ln -sf /etc/nginx/sites-available/cauri-api.conf /etc/nginx/sites-enabled/cauri-api.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois o Certbot emite o certificado e reescreve este arquivo com o bloco 443 e o
# redirecionamento de HTTP para HTTPS:
#
#   sudo certbot --nginx -d "$API_DOMAIN"

server {
    listen 80;
    listen [::]:80;
    server_name api.SEU-DOMINIO;

    # Planilhas de importação (Fase 4) chegam por aqui; 10 MB por envio é folgado.
    client_max_body_size 10m;

    # Áudio do assistente (Fase 5) pode demorar um pouco mais para subir.
    client_body_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Healthcheck sem poluir o log de acesso.
    location = /health {
        proxy_pass http://127.0.0.1:8010/health;
        access_log off;
    }
}
