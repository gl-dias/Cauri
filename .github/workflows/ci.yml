name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Varre todo o histórico em busca de segredos (chaves, tokens, senhas). Roda em todo PR.
  # Falso positivo conhecido se marca na própria linha com `gitleaks:allow`.
  gitleaks:
    name: Segredos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instala o gitleaks (versão fixa, checksum conferido)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download"
          curl -sSfL -o "$archive" "${base}/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Varre o histórico
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1 --no-banner

  backend:
    name: Backend e banco
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      # Só o que os testes usam: Postgres, Auth (cria o schema auth), PostgREST e Kong.
      - name: Sobe o Supabase local
        run: >
          supabase start
          -x studio,imgproxy,mailpit,storage-api,postgres-meta,logflare,vector,supavisor,realtime,edge-runtime

      - name: Testes de banco (pgTAP)
        run: supabase test db

      # A setup-uv não publica tag de versão maior desde a v8: fica fixada na exata.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instala o workspace
        working-directory: backend
        run: uv sync --all-packages --frozen

      - name: Ruff (lint)
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff (formatação)
        working-directory: backend
        run: uv run ruff format --check .

      - name: Mypy (strict)
        working-directory: backend
        run: >
          uv run mypy
          -p cauri_core -p cauri_storage -p cauri_engine -p cauri_ledger
          -p cauri_manual_entry -p cauri_ingest_market -p cauri_api -p cauri_jobs

      - name: Fronteiras entre módulos (import-linter)
        working-directory: backend
        run: uv run lint-imports

      # Os testes marcados com `db` usam o Supabase local que subiu acima
      # (CAURI_TEST_ADMIN_URL e CAURI_TEST_API_URL já têm o padrão local).
      - name: Pytest
        working-directory: backend
        run: uv run pytest

  web:
    name: Front (tipos, testes e build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instala
        run: npm ci

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm test

      - name: Build
        run: npx vite build

  # Trava de interface: contraste WCAG AA de todo texto visível sobre o vidro e nenhuma
  # rolagem horizontal, no desktop e no celular. Backend simulado com as fixtures do demo
  # (e2e/fixtures), então não precisa de banco.
  interface:
    name: Interface (contraste AA e layout)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      CAURI_SHOTS_DIR: ${{ runner.temp }}/interface
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instala
        run: npm ci

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Contraste e layout
        run: npx playwright test

      - name: Relatórios (quando falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interface
          path: ${{ runner.temp }}/interface
          retention-days: 7
