name: Mercado diário

on:
  schedule:
    # O cron do GitHub é sempre em UTC. Brasília é UTC-3 o ano inteiro (o Brasil não tem
    # horário de verão desde 2019), então estes horários não mudam ao longo do ano. Se o
    # Brasil voltar a ter horário de verão, trocar para 20:30 e 21:30 UTC nesse período.
    #
    # O que muda no ano é o fechamento da B3, que acompanha o horário de verão americano:
    # com ele (março a outubro), o call termina às 17h; sem ele (novembro a março), às 18h.
    # Nos meses sem horário de verão americano, às 18h30 o fechamento pode não ter chegado
    # pela brapi gratuita (uns 30 min de atraso); a segunda passada completa.
    - cron: "30 21 * * 1-5" # 18h30 em Brasília: primeira passada
    - cron: "30 22 * * 1-5" # 19h30 em Brasília: segunda passada, só o que faltou
  workflow_dispatch:
    inputs:
      pass:
        description: Passada
        type: choice
        options: [first, second]
        default: first
      date:
        description: Data no formato AAAA-MM-DD (vazio = hoje em Brasília)
        required: false

permissions:
  contents: read
  actions: write # keepalive: reativa o próprio agendamento

concurrency:
  group: daily-market
  cancel-in-progress: false

jobs:
  daily:
    name: Fechamento e snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAURI_INGEST_DATABASE_URL: ${{ secrets.CAURI_INGEST_DATABASE_URL }}
      BRAPI_API_KEY: ${{ secrets.BRAPI_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      PASS: ${{ github.event.schedule == '30 22 * * 1-5' && 'second' || inputs.pass || 'first' }}
      DATE_INPUT: ${{ inputs.date }}
    steps:
      # Até o banco de produção existir (Fase 6), o agendamento roda e sai sem erro.
      - name: Banco configurado?
        id: guard
        run: |
          if [ -z "$CAURI_INGEST_DATABASE_URL" ]; then
            echo "::notice::Sem CAURI_INGEST_DATABASE_URL nos secrets (banco de produção entra na Fase 6). Nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'

      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.guard.outputs.skip != 'true'
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instala os jobs
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        run: uv sync --frozen --no-dev --package cauri-jobs

      - name: Fechamento do dia e snapshots
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        run: |
          args=(daily --pass "$PASS")
          if [ -n "$DATE_INPUT" ]; then args+=(--date "$DATE_INPUT"); fi
          uv run --no-sync cauri-jobs "${args[@]}"

      # O GitHub desliga agendamentos de repo público depois de 60 dias sem atividade.
      # Reativar pela API zera essa contagem sem precisar de commit.
      - name: Mantém o agendamento vivo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-market.yml/enable"
