- {ticker: ADA, name: Cardano, coingecko: cardano}
- {ticker: DOGE, name: Dogecoin, coingecko: dogecoin}
- {ticker: AVAX, name: Avalanche, coingecko: avalanche-2}
- {ticker: LINK, name: Chainlink, coingecko: chainlink}
- {ticker: DOT, name: Polkadot, coingecko: polkadot}
- {ticker: LTC, name: Litecoin, coingecko: litecoin}
