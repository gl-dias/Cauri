[project]
name = "cauri-ledger"
version = "0.1.0"
description = "Fonte única de verdade das movimentações"
requires-python = ">=3.13"
dependencies = [
  "cauri-core",
  "cauri-engine",
  "cauri-storage",
]

[tool.uv.sources]
cauri-core = { workspace = true }
cauri-engine = { workspace = true }
cauri-storage = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
