[project]
name = "cauri-importers"
version = "0.1.0"
description = "Importação de planilhas: adaptadores, pré-visualização e gravação pelo ledger"
requires-python = ">=3.13"
dependencies = [
  "cauri-core",
  "cauri-engine",
  "cauri-ledger",
  "openpyxl>=3.1.5",
  "defusedxml>=0.7.1",
]

[tool.uv.sources]
cauri-core = { workspace = true }
cauri-engine = { workspace = true }
cauri-ledger = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
