[project]
name = "cauri-api"
version = "0.1.0"
description = "API HTTP de escrita (FastAPI)"
requires-python = ">=3.13"
dependencies = [
  "cauri-core",
  "cauri-storage",
  "cauri-engine",
  "cauri-ledger",
  "cauri-manual-entry",
  "cauri-importers",
  "fastapi>=0.120",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.38",
  "pyjwt[crypto]>=2.10",
  "pydantic-settings>=2.11",
]

[tool.uv.sources]
cauri-core = { workspace = true }
cauri-storage = { workspace = true }
cauri-engine = { workspace = true }
cauri-ledger = { workspace = true }
cauri-manual-entry = { workspace = true }
cauri-importers = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
