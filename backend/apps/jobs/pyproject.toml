[project]
name = "cauri-jobs"
version = "0.1.0"
description = "Jobs de linha de comando: backfill, seed do demo, bootstrap do admin"
requires-python = ">=3.13"
dependencies = [
  "cauri-core",
  "cauri-storage",
  "cauri-engine",
  "cauri-ledger",
  "cauri-ingest-market",
  "pyyaml>=6.0",
]

[project.scripts]
cauri-jobs = "cauri_jobs.cli:main"

[tool.uv.sources]
cauri-core = { workspace = true }
cauri-storage = { workspace = true }
cauri-engine = { workspace = true }
cauri-ledger = { workspace = true }
cauri-ingest-market = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
